<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f2">
  <title>镜序</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1e21'/%3E%3Crect x='5' y='10.5' width='6' height='11' rx='2.2' fill='%23fff' opacity='.4'/%3E%3Crect x='13' y='7.5' width='6' height='17' rx='2.2' fill='%23fff'/%3E%3Crect x='21' y='10.5' width='6' height='11' rx='2.2' fill='%23e9805c'/%3E%3C/svg%3E">
  <script>(function(){var t='system';try{t=localStorage.getItem('drama-theme')||'system'}catch(e){}document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t==='dark'?'dark':'light'})()</script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i><canvas id="space"></canvas><canvas id="galaxy"></canvas></div>
  <div id="app"><div class="initial-loading"><svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-logo-prev" x="3" y="9" width="7" height="14" rx="2.5"/><rect class="brand-logo-now" x="12.5" y="6" width="7" height="20" rx="2.5"/><rect class="brand-logo-next" x="22" y="9" width="7" height="14" rx="2.5"/></svg><p>正在打开工作台…</p></div></div>

  <div id="toast" role="status" aria-live="polite"></div>
  <input id="asset-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <div class="zip-drop-cover" aria-hidden="true"><div><strong>松开导入剧本</strong><span>镜序导出的 ZIP，会作为新项目加入，不覆盖已有的</span></div></div>
  <input id="project-import-file" type="file" accept=".zip,application/zip" hidden>
  <script type="module" src="/app.js"></script>
  <script src="/backdrop.js" defer></script>
</body>
</html>
