name: Publish clean update
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify version and tests
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if("v"+JSON.parse(fs.readFileSync("package.json")).version!==process.env.GITHUB_REF_NAME)process.exit(1)'
          npm test
      - name: Build public update
        run: node scripts/build-update.mjs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" outputs/jingxu-update.json --title "$GITHUB_REF_NAME" --generate-notes
